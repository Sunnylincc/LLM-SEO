[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-seo"
version = "0.1.0"
description = "CLI + local web UI to optimize content discoverability and citation readiness for LLMs"
readme = "README.md"
authors = [{name = "LLM-SEO Contributors"}]
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "markdownify>=0.12",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
openai = ["openai>=1.35"]
local-embeddings = ["sentence-transformers>=3.0", "numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
llm-seo = "llm_seo.cli:app"

[tool.setuptools.packages.find]
include = ["llm_seo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
